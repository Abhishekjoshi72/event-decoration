<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">Settings</h1>

  <div [@cardAnimation] class="bg-white rounded-xl shadow-sm p-6 space-y-4">
    <h2 class="text-xl font-semibold text-gray-800 border-b pb-3 mb-4">General Settings</h2>
    
    <div>
      <label for="siteName" class="block text-sm font-medium text-gray-700">Site Name</label>
      <input type="text" id="siteName" [(ngModel)]="generalSettings.siteName"
             class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-brand-purple focus:border-brand-purple sm:text-sm">
    </div>

    <div class="flex items-center justify-between">
      <label for="emailNotifications" class="text-sm font-medium text-gray-700 cursor-pointer">Email Notifications</label>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="emailNotifications" [(ngModel)]="generalSettings.emailNotifications" class="sr-only peer">
        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-brand-light rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-brand-purple"></div>
      </label>
    </div>

    <div class="flex items-center justify-between">
      <label for="darkMode" class="text-sm font-medium text-gray-700 cursor-pointer">Dark Mode</label>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="darkMode" [(ngModel)]="generalSettings.darkMode" class="sr-only peer">
        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-brand-light rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-brand-purple"></div>
      </label>
    </div>
  </div>

  <div [@cardAnimation] class="bg-white rounded-xl shadow-sm p-6 space-y-4">
    <h2 class="text-xl font-semibold text-gray-800 border-b pb-3 mb-4">User Profile</h2>
    
    <div>
      <label for="userName" class="block text-sm font-medium text-gray-700">Username</label>
      <input type="text" id="userName" [(ngModel)]="profileSettings.userName"
             class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-brand-purple focus:border-brand-purple sm:text-sm">
    </div>

    <div>
      <label for="userEmail" class="block text-sm font-medium text-gray-700">Email Address</label>
      <input type="email" id="userEmail" [(ngModel)]="profileSettings.userEmail"
             class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-brand-purple focus:border-brand-purple sm:text-sm">
    </div>
  </div>

  <div class="flex justify-end pt-4">
    <button (click)="saveSettings()" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-brand-purple hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-purple transition-colors">
      Save Settings
    </button>
  </div>
</div>
