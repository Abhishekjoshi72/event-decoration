<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">Inventory Management</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" [@listAnimation]="inventoryItems.length">
    <div *ngFor="let item of inventoryItems" [@cardAnimation] class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col hover:shadow-md transition-shadow">
      <div class="h-40 bg-gray-100 flex items-center justify-center overflow-hidden">
        <img [src]="item.imageUrl" [alt]="item.name" class="object-cover w-full h-full">
      </div>
      <div class="p-4 flex-1 flex flex-col">
        <div class="flex justify-between items-start mb-2">
          <h2 class="text-lg font-semibold text-gray-800 line-clamp-1">{{ item.name }}</h2>
          <span class="px-2 py-0.5 text-xs font-semibold rounded-full" [ngClass]="getStatusClass(item.status)">
            {{ item.status }}
          </span>
        </div>
        <div class="text-sm text-gray-600 mb-1">Category: {{ item.category }}</div>
        <div class="text-sm text-gray-600 mb-3">Quantity: <span class="font-medium text-gray-800">{{ item.quantity }}</span></div>

        <div class="mt-auto flex justify-between items-center pt-3 border-t border-gray-100">
          <span class="text-xs text-gray-500">Last Used: {{ item.lastUsed | date:'shortDate' }}</span>
          <div class="flex space-x-2">
            <button class="text-gray-500 hover:text-brand-purple transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
            </button>
            <button class="text-gray-500 hover:text-red-600 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
