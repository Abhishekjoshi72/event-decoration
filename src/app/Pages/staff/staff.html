<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">Team Members</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" [@listAnimation]="staffMembers.length">
    <div *ngFor="let member of staffMembers" [@cardAnimation] class="bg-white rounded-xl shadow-sm p-6 text-center space-y-3 hover:shadow-md transition-shadow">
      <img [src]="member.imageUrl" [alt]="member.name" class="w-24 h-24 rounded-full mx-auto object-cover border-4 border-brand-purple">
      <h2 class="text-xl font-semibold text-gray-800">{{ member.name }}</h2>
      <p class="text-brand-purple font-medium">{{ member.role }}</p>
      <p class="text-gray-600 text-sm">{{ member.email }}</p>
      <p class="text-gray-600 text-sm">{{ member.phone }}</p>
      <span class="px-3 py-1 text-xs font-semibold rounded-full mt-2 inline-block" [ngClass]="getStatusClass(member.status)">
        {{ member.status }}
      </span>
      <div class="flex justify-center space-x-3 pt-3 border-t border-gray-100 mt-4">
        <button class="text-gray-500 hover:text-brand-purple transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
        </button>
        <button class="text-gray-500 hover:text-red-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        </button>
      </div>
    </div>
  </div>
</div>
