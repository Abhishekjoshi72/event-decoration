<div class="space-y-8">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h1 class="text-3xl font-bold text-gray-800">Dashboard</h1>
    <button class="bg-brand-purple text-white px-4 py-2 rounded-lg shadow hover:bg-purple-600 transition">
      Generate Report
    </button>
    
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    
    <app-stat-card title="Upcoming Events" value="12" color="purple" class="hover:scale-105 transition-transform duration-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    </app-stat-card>

    <app-stat-card title="Pending Requests" value="5" color="orange" class="hover:scale-105 transition-transform duration-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </app-stat-card>

    <app-stat-card title="Active Inventory" value="85%" color="blue" class="hover:scale-105 transition-transform duration-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
      </svg>
    </app-stat-card>

    <app-stat-card title="MTD Revenue" value="$15,200" color="green" class="hover:scale-105 transition-transform duration-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </app-stat-card>
  </div>

  <!-- Recent Bookings Table -->
  <div class="bg-white rounded-xl shadow-md p-6 transition hover:shadow-lg duration-300">

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold text-gray-800">Recent Bookings</h2>
      <button class="text-sm text-brand-purple hover:underline">View All</button>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full text-sm text-left divide-y divide-gray-200">
        <thead class="bg-gray-100 text-gray-700 font-semibold">
          <tr>
            <th class="px-6 py-3">Client / Event</th>
            <th class="px-6 py-3">Date</th>
            <th class="px-6 py-3">Type</th>
            <th class="px-6 py-3">Status</th>
            <th class="px-6 py-3 text-right">Amount</th>
          </tr>
        </thead>

        <tbody class="divide-y">
          <tr *ngFor="let booking of recentBookings" class="hover:bg-gray-50 transition">
            <td class="px-6 py-4 font-medium text-gray-900">{{ booking.client }}</td>
            <td class="px-6 py-4 text-gray-500">{{ booking.date }}</td>
            <td class="px-6 py-4 text-gray-500">{{ booking.type }}</td>
            <td class="px-6 py-4">
              <span class=" px-3 py-1 text-xs rounded-full font-semibold" 
              [ngClass]="getStatusClass(booking.status)">
                {{ booking.status }}
              </span>
            </td>
            <td class="px-6 py-4 text-right font-semibold text-gray-800">
              {{ booking.amount }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
