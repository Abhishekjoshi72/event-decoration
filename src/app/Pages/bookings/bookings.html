<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">Bookings Management</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" [@listAnimation]="bookings.length">
    <div *ngFor="let booking of bookings" [@cardAnimation] class="bg-white rounded-xl shadow-sm p-6 space-y-3 border-l-4"
         [ngClass]="{'border-green-500': booking.status === 'Confirmed', 'border-orange-500': booking.status === 'Pending', 'border-blue-500': booking.status === 'Draft'}">
      <div class="flex justify-between items-start">
        <h2 class="text-lg font-semibold text-gray-800">{{ booking.client }}</h2>
        <span class="px-3 py-1 text-xs font-semibold rounded-full" [ngClass]="getStatusClass(booking.status)">
          {{ booking.status }}
        </span>
      </div>
      <p class="text-gray-600 text-sm">{{ booking.service }}</p>
      <div class="flex items-center text-gray-500 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        <span>{{ booking.date | date:'mediumDate' }}</span>
      </div>
      <div class="flex items-center justify-between pt-2 border-t border-gray-100">
        <span class="text-xl font-bold text-brand-purple">${{ booking.amount | number:'1.2-2' }}</span>
        <div class="flex space-x-2">
          <button class="text-gray-500 hover:text-brand-purple transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
          </button>
          <button class="text-gray-500 hover:text-red-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
