<header class="h-16 bg-white dark:bg-gray-900 shadow flex items-center justify-between px-6 md:px-10 sticky top-0 z-50">

    <!-- Left Title -->
    <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200">
        Admin Overview
    </h2>

    <!-- Right Section -->
    <div class="flex items-center gap-4">

        <!-- Notification Button -->
        <button class="relative p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition duration-150">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 
          0 00-4-5.659V5a2 2 0 10-4 
          0v.341C7.67 6.165 6 8.388 
          6 11v3.159c0 .538-.214 1.055-.595 
          1.436L4 17h5m6 0v1a3 3 0 
          11-6 0v-1m6 0H9" />
            </svg>

            <!-- Badge -->
            <span
                class="absolute top-1 right-1 bg-red-500 text-white w-3.5 h-3.5 rounded-full text-[10px] flex items-center justify-center">3</span>
        </button>

        <!-- Profile Dropdown Trigger -->
        <div class="relative group cursor-pointer">
            <div class="flex items-center gap-2">
                <img src="https://i.pravatar.cc/40?img=47" alt="Admin"
                    class="h-9 w-9 rounded-full border border-gray-200 dark:border-gray-600 object-cover">
                <span class="hidden sm:block text-sm font-medium text-gray-700 dark:text-gray-300">
                    Sarah J.
                </span>
            </div>

            <!-- Dropdown Menu -->
            <div
                class="absolute right-0 mt-3 w-40 bg-white dark:bg-gray-800 shadow-lg rounded-lg py-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition">
                <button
                    class="w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm text-gray-700 dark:text-gray-300">
                    Profile
                </button>
                <button
                    class="w-full text-left px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm text-gray-700 dark:text-gray-300">
                    Settings
                </button>
                <hr class="my-1 border-gray-200 dark:border-gray-700" />
                <button class="w-full text-left px-4 py-2 hover:bg-red-50 dark:hover:bg-gray-700 text-sm text-red-600">
                    Logout
                </button>
            </div>
        </div>
    </div>
</header>
